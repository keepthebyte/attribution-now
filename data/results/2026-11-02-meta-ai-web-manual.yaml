# muse.ai in Chrome on macOS, logged in, fresh side chat. Session 2026-11-03 05:55-05:58 UTC (Nov 2 local);
# evidence is the worker's hit log. Every link in a Muse answer is wrapped in Meta's link shim
# `https://l.meta.ai/?u=<target>&h=<hash>` with rel="noopener noreferrer" target="_blank". muse.ai itself sends
# Referrer-Policy: strict-origin-when-cross-origin, but noreferrer strips it on the hop to the shim; the shim then
# sends its own origin. Every click arrived with Referer `https://l.meta.ai/` (origin only, Sec-Fetch-Site
# cross-site), never `https://muse.ai/`, and with no utm_* parameter. The shim passed query strings, fragments,
# existing utm_* and signed parameters through byte-identical.
# Muse has no inline citation markers and no separate sources panel: asked to cite with inline citations, it wrote
# a plain "Sources:" list of links at the end of the answer text. A bare URL in the answer renders as a link preview
# card, fetched first by `EctoBot/1.0 (OpenGraph Preview)`; Muse read the cited page as
# `meta-webindexer/1.1 (+https://developers.facebook.com/docs/sharing/webmasters/crawler)`.
