# ChatGPT iOS app 1.2026.279 on iOS 27.2 (iPhone). Link test session, 13:53-13:57 UTC; evidence is the worker's hit log.
# Every link opened in an in-app browser sheet. Its user agent is plain Mobile Safari ("Version/27.2 Mobile/15E148
# Safari/604.1"), which points to SFSafariViewController rather than a custom web view. Every tap arrived with
# Sec-Fetch-Site: none, no Referer header and an empty document.referrer, the same as a typed URL. No ios-app://
# referrer either, unlike the Android app's android-app://com.openai.chatgpt/. Links in ChatGPT's answers carry
# utm_source=chatgpt.com; a link in the user's own message does not. Each cited URL was also fetched by
# ChatGPT-User and by a link-preview bot (facebookexternalhit) before the tap.
