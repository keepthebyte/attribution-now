# Muse 10.1 (com.meta.endo) macOS app, logged in, fresh side chat. Session 2026-11-03 06:18-06:20 UTC (Nov 2 local);
# evidence is the worker's hit log. The tester typed the prompts and clicked; Claude Code read the log (no computer
# use in this session). Every link opened in the default browser (Chrome 156, already running), not in an in-app
# view. Every click arrived with Sec-Fetch-Site: none, no Referer header, an empty document.referrer and no utm_*
# parameter, the same as a typed URL, so every visit lands in Direct. On muse.ai web the same links arrive with
# Referer https://l.meta.ai/ (see 2026-11-02-meta-ai-web-manual.yaml). Not checked: whether the app opens the
# l.meta.ai shim or the target URL directly. Muse adds no tag, so the merge targets arrived unchanged, fragment
# included. Muse read the cited page as `meta-webindexer/1.1`; unlike on the web, no `EctoBot` preview fetch was
# logged for the bare URL.
