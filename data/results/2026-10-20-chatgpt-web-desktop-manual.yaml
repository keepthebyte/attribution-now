date: 2026-10-20
lab: openai-chatgpt
surface: web-desktop
method: manual
tester: cedric (via Claude in Chrome)
client: Chrome 155.0.8059.85 / macOS 27.2
source_url: null
results:
  # Answer with web search ("Instant" mode). chatgpt.com sends Referrer-Policy: strict-origin-when-cross-origin
  # and <meta name="referrer" content="origin">, but every outbound link has rel="noopener noreferrer".
  - location: inline-citation
    test: REF-01
    status: missing
    evidence:
      document_referrer: null
      landing_url: https://www.rfc-editor.org/rfc/rfc9110.html?utm_source=chatgpt.com
      notes: Clicked the "RFC Editor" citation chip; document.referrer was empty on the landing page.
  - location: inline-citation
    test: REF-02
    status: n/a
    evidence:
      notes: No referrer is sent, so nothing can leak.
  - location: inline-citation
    test: REF-03
    status: missing
    evidence:
      notes: Citation links use rel="noopener noreferrer", which removes the referrer despite the page's origin policy.
  - location: inline-citation
    test: UTM-01
    status: works
    evidence:
      landing_url: https://www.rfc-editor.org/rfc/rfc9110.html?utm_source=chatgpt.com
      notes: utm_source=chatgpt.com on every citation link.
  - location: bare-url
    test: REF-01
    status: missing
    evidence:
      document_referrer: null
      landing_url: https://www.rfc-editor.org/rfc/rfc9110.html?utm_source=chatgpt.com#section-10.1.3
      notes: Clicked a link written in the answer text ("Source:" line); document.referrer was empty.
  - location: bare-url
    test: REF-03
    status: missing
    evidence:
      notes: Links in answer text and the "Primary sources" list use rel="noopener noreferrer".
  - location: bare-url
    test: UTM-01
    status: works
    evidence:
      notes: utm_source=chatgpt.com on every link in the answer text.
  - location: bare-url
    test: MRG-02
    status: works
    evidence:
      landing_url: https://www.rfc-editor.org/rfc/rfc9110.html?utm_source=chatgpt.com#section-10.1.3
      notes: Tag inserted before the existing fragment.
  # Pasted test URLs, echoed back as links.
  - location: pasted-link
    test: REF-01
    status: missing
    evidence:
      document_referrer: null
      landing_url: https://main--attribution-now--keepthebyte.aem.page/t/mrg-02/openai-chatgpt/web-desktop/pasted-link?utm_source=chatgpt.com#section-2
      notes: Clicked the echoed mrg-02 link; document.referrer was empty.
  - location: pasted-link
    test: REF-03
    status: missing
    evidence:
      notes: Echoed links use rel="noopener noreferrer".
  - location: pasted-link
    test: UTM-01
    status: works
    evidence:
      notes: utm_source=chatgpt.com added to echoed links. The visible link text stays unchanged; only the href is tagged.
  - location: pasted-link
    test: MRG-01
    status: works
    evidence:
      notes: "?a=1&b=2 kept in order; tag appended after them."
  - location: pasted-link
    test: MRG-02
    status: works
    evidence:
      landing_url: https://main--attribution-now--keepthebyte.aem.page/t/mrg-02/openai-chatgpt/web-desktop/pasted-link?utm_source=chatgpt.com#section-2
      notes: Fragment kept; tag inserted before it.
  - location: pasted-link
    test: MRG-03
    status: missing
    evidence:
      notes: "Target with utm_source=newsletter&utm_medium=email arrived with utm_source=chatgpt.com: the site's own value was replaced (utm_medium=email kept)."
  - location: pasted-link
    test: MRG-04
    status: missing
    evidence:
      notes: "Target with expires=2099-01-01&signature=abc123 arrived with utm_source=chatgpt.com appended, so it is no longer byte-identical."
