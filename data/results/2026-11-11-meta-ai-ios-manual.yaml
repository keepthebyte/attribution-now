# Muse 15.1.0 iOS app on iOS 18.7, logged in, a fresh chat per location. Session 2026-11-12 00:33-00:42 UTC
# (Nov 11 local); evidence is the worker's hit log. The tester typed the prompts and tapped; Claude Code read the log.
# Links open in an in-app browser (SFSafariViewController: Safari 27.3 user agent, 342x563 viewport on a 393x852
# screen). Every tap arrived with Sec-Fetch-Site: none, no Referer, an empty document.referrer and no utm_*
# parameter, so every visit lands in Direct, as in the Mac app. The tester saw no tag on the link itself either.
