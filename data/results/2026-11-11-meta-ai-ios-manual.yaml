# Each cited URL was first fetched by facebookexternalhit/1.1 from the tester's own network (link preview, unsigned),
# then read by meta-webindexer/1.1 from Cloudflare, signed with Signature-Agent "https://www.meta.com".
# No sources panel: the cited link appears only in the answer text. pasted-link not tested (no hit logged).
# Merge tests skipped: Muse adds no tag here.
