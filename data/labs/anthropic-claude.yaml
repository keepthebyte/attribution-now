id: anthropic-claude
name: Claude
company: Anthropic
documented_utm: null
suggested_utm: claude.ai
docs_url: null
contact: null
what_works: >
  Links Claude writes in the answer text on claude.ai send `https://claude.ai/` as the referrer: the origin
  only, with no conversation path. Sites that read the referrer can already count those visits as Claude.
what_works_date: 2026-10-20
seo_summary: "Claude's answer links send the claude.ai referrer, but Claude adds no UTM tag and its citation chips send no referrer."
# link_locations are candidates until confirmed by a verified test run.
surfaces:
  - id: web
    name: claude.ai web
    platform: web
    link_locations: [inline-citation, sources-panel, deep-research, canvas, bare-url, pasted-link, shared-conversation]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, sources-panel, deep-research, bare-url, pasted-link]
  - id: android
    name: Android app
    platform: native
    link_locations: [inline-citation, sources-panel, deep-research, bare-url, pasted-link]
  - id: macos
    name: macOS app
    platform: native
    link_locations: [inline-citation, sources-panel, deep-research, canvas, bare-url, pasted-link]
  - id: windows
    name: Windows app
    platform: native
    link_locations: [inline-citation, sources-panel, deep-research, canvas, bare-url, pasted-link]
  - id: chrome
    name: Claude in Chrome
    platform: web
    link_locations: [inline-citation, bare-url, pasted-link]
work_items:
  - id: claude-utm
    title: Add a documented UTM tag
    tests: [UTM-01, UTM-02, UTM-03]
    surfaces: [web, ios, android, macos, windows, chrome]
    status: open
    summary: >
      Claude links carry no UTM tag, so visits from the apps, where no referrer is possible, arrive as Direct.
    suggested_fix: >
      Add one stable `utm_source` value (for example `claude.ai`) to outbound links on every surface with a safe
      merge, and publish the value in the Help Center.
  - id: claude-citation-referrer
    title: Send the claude.ai referrer from citation chips
    tests: [REF-01, REF-03]
    surfaces: [web]
    link_locations: [inline-citation]
    status: open
    summary: >
      Links in the answer text already send the `claude.ai` referrer, but the inline citation chips use
      `rel="noopener noreferrer"`, so clicks on citations arrive with no referrer and count as Direct.
    suggested_fix: >
      Drop `noreferrer` from the citation chip component and keep `noopener`, matching links in the answer text.
      The page's `strict-origin-when-cross-origin` policy keeps it to the origin.
  - id: claude-android-referrer
    title: Pass an app referrer from the Android app
    tests: [REF-01]
    surfaces: [android]
    status: open
    summary: >
      The Android app sends no referrer, so tools that rely on the referrer see Direct even when Claude sent the visit.
    suggested_fix: >
      Open links in a Custom Tab and set `Intent.EXTRA_REFERRER` to `android-app://com.anthropic.claude`, so the
      browser can pass an app referrer.
  - id: claude-changelog
    title: Publish a changelog for link behavior
    tests: [OPS-01]
    surfaces: [web, ios, android, macos, windows, chrome]
    status: open
    summary: >
      There is no public note on how Claude links are attributed, so sites can't tell a product change from a
      traffic change.
    suggested_fix: >
      Add a short Help Center page on link attribution (referrer, UTM value once added) with dated updates.
# Personal agent: browses for one person in its own cloud browser (see /detect-personal-agent-traffic).
agent:
  id: claude-duet
  name: Claude Duet
  launched: October 21, 2026, research preview
  source_url: https://letsdatascience.com/news/anthropic-opens-claude-duet-research-preview-for-proactive-a-16522f5d
  summary: >
    Duet works for one person across their connected accounts and keeps going while they are away, in its own
    virtual machine and browser. It asks before it sends messages, pays, signs or deletes anything.
  recognize: >
    The user agent is a normal Chrome one with `Claude-Agent/1.0` added. Anyone can copy that name, so count it as
    declared, not proven.
  signals:
    names:
      status: works
      date: 2026-10-30
      method: manual
      notes: "User agent: `Mozilla/5.0 (X11; Linux x86_64) … (KHTML, like Gecko; compatible; Claude-Agent/1.0) Chrome/156.0.0.0 …`, from Google Cloud's network. One run."
    signs:
      status: missing
      date: 2026-10-30
      method: manual
      notes: No `Signature-Agent` or `Signature` header.
    tags:
      status: untested
