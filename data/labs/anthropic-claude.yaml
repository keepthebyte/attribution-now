what_works: >
  Links clicked on claude.ai send a `claude.ai` referrer, so sites that read the referrer can already count
  visits from Claude on the web.
what_works_date: 2026-10-19
# link_locations are candidates until confirmed by a verified test run.
surfaces:
  - id: web
    name: claude.ai web
    platform: web
    link_locations: [inline-citation, sources-panel, deep-research, canvas, bare-url, pasted-link, shared-conversation]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, sources-panel, deep-research, bare-url, pasted-link]
  - id: android
    name: Android app
    platform: native
    link_locations: [inline-citation, sources-panel, deep-research, bare-url, pasted-link]
  - id: macos
