what_works: >
  Manus's cloud browser names itself with `Manus-User/1.0` and signs its page loads with Web Bot Auth, so a site
  can verify a visit against the key Manus publishes. It runs the page's JavaScript, so analytics tags count it,
  and its analytics beacons carry the name but no signature.
what_works_date: 2026-10-31
seo_summary: "Manus's cloud browser names itself (Manus-User/1.0) and signs page loads with Web Bot Auth, so sites can verify it."
assistant_note: We haven't tested the links in Manus's answers yet. This page covers its cloud browser.
