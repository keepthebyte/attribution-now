id: meta-ai
name: Meta AI
company: Meta
documented_utm: null
docs_url: null
contact: null
what_works: >
  Muse reads an A2A agent card when it finds one. When it found ours, it messaged us and introduced itself as an
  AI browser agent acting for a researcher.
what_works_date: 2026-10-30
seo_summary: "Meta's personal agent Muse browses like a person, without naming itself or signing its requests."
assistant_note: >
  On muse.ai, links in Muse's answers pass through Meta's link shim and arrive with the referrer
  `https://l.meta.ai/`, not `https://muse.ai/`. In the Mac app they arrive with no referrer. Muse adds no UTM tag
  anywhere we tested. Its apps on iOS, Android and WhatsApp are next.
# Muse chat: muse.ai, the mobile and Mac apps, and WhatsApp. web confirmed 2026-11-02 (no sources panel; sources are
# links in the answer text); the other surfaces' link_locations are candidates until a verified run.
# Since 2026-11-08 a URL pasted into a Muse chat is first fetched by `facebookexternalhit/1.1` (link preview, unsigned),
# where it was `EctoBot/1.0 (OpenGraph Preview)` on November 2.
# AEM Operational Telemetry already shows a few visits with the `https://muse.ai/` referrer (Sep–Oct 2026).
surfaces:
  - id: web
    name: muse.ai web
    platform: web
    link_locations: [inline-citation, bare-url, pasted-link]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, sources-panel, bare-url, pasted-link]
  - id: android
    name: Android app
    platform: native
    link_locations: [inline-citation, sources-panel, bare-url, pasted-link]
  - id: macos
    name: macOS app
    platform: native
    link_locations: [inline-citation, sources-panel, bare-url, pasted-link]
  - id: whatsapp
    name: Muse in WhatsApp
    platform: native
    link_locations: [bare-url, pasted-link]
work_items: []
# Personal agent: browses for one person in its own cloud browser (see /detect-personal-agent-traffic).
agent:
  id: meta-muse
  name: Meta Muse
  launched: September 8, 2026
  source_url: https://axios.com/2026/09/08/meta-debuts-muse-personal-ai-agent
  summary: >
    Muse runs errands for one person: it books travel, fills forms and checks out, in a dedicated cloud machine
    with its own browser.
  recognize: >
    Only by inference. Muse claims Linux x86_64 and sends only the "Chromium" brand in `Sec-CH-UA`, where Chrome
    also sends "Google Chrome". It comes from Cloudflare's network and renders with a software GPU on an ARM
    processor.
  signals:
    names:
      status: missing
      date: 2026-11-08
      method: manual
      notes: "User agent: `Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36`, no name. 13 runs from October 29 to 30, and 3 on November 8 started from muse.ai, the iOS app and the Mac app."
    signs:
      status: missing
      date: 2026-11-08
      method: manual
      notes: >
        No `Signature-Agent`, `Signature-Input` or `Signature` header in 13 runs from October 29 to 30, nor in 3
        runs on November 8 started from muse.ai, the iOS app and the Mac app (run-sig-1 on each).
    tags:
      status: untested
