id: meta-ai
name: Meta AI
company: Meta
documented_utm: null
docs_url: null
contact: null
what_works: >
  Muse supports the Personal Agent Protocol (Poppy). It checks each site it visits for `/.well-known/poppy.json` and
  names itself `Muse-PersonalAgent/0.3` on those requests. When it talks to a site's agent, it signs every request
  so the site can verify it comes from Muse. It also reads an A2A agent card when it finds one.
what_works_date: 2026-11-16
seo_summary: "Meta's personal agent Muse checks sites for poppy.json by name, but its browser visits stay unnamed and unsigned."
assistant_note: >
  Muse sends traffic two ways. On muse.ai, links in Muse's answers pass through Meta's link shim and arrive with the
  referrer `https://l.meta.ai/` and no UTM tag; in the Mac app and the iOS app (15.1.0, in-app browser) they arrive
  with neither. In the field, `l.meta.ai` visits come mostly from Windows and Mac desktops. Since November 10 we also
  see phone visits tagged `utm_source=l.metamuse.ai`, which look like taps in a newer mobile build that is still
  rolling out.
# Field data, AEM Operational Telemetry, November 2026 (not shown on the page):
# - utm_source=l.metamuse.ai: corporate.walmart.com (Android, Nov 11) and sparkdriverapp.com (iPhone, Nov 10).
# - Referrer https://l.meta.ai/: 46 sampled entries on 37 sites, 28 Windows, 13 Mac, 1 Linux, none with the Muse UTM.
# Muse chat: muse.ai, the mobile and Mac apps, and WhatsApp. web confirmed 2026-11-02 and ios 2026-11-11 (no sources
# panel; sources are links in the answer text); the other surfaces' link_locations are candidates until a verified run.
# Since 2026-11-08 a URL pasted into a Muse chat is first fetched by `facebookexternalhit/1.1` (link preview, unsigned),
# where it was `EctoBot/1.0 (OpenGraph Preview)` on November 2.
# AEM Operational Telemetry already shows a few visits with the `https://muse.ai/` referrer (Sep–Oct 2026).
surfaces:
  - id: web
    name: muse.ai web
    platform: web
    link_locations: [inline-citation, bare-url, pasted-link]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, bare-url, pasted-link]
  - id: android
    name: Android app
    platform: native
    link_locations: [inline-citation, sources-panel, bare-url, pasted-link]
  - id: macos
    name: macOS app
    platform: native
    link_locations: [inline-citation, sources-panel, bare-url, pasted-link]
  - id: whatsapp
    name: Muse in WhatsApp
    platform: native
