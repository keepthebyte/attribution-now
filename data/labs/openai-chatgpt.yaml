id: openai-chatgpt
name: ChatGPT
company: OpenAI
documented_utm: chatgpt.com
docs_url: https://help.openai.com/en/articles/12627856
contact: null
what_works: >
  OpenAI publishes the `utm_source=chatgpt.com` value in its publisher FAQ, and ChatGPT adds it to every
  outbound link we tested on the web: citations, links in the answer text and links the user pasted. It keeps
  existing query parameters and inserts the tag before a `#fragment`. After a UI update in early October 2026,
  the tag was restored within about a week. Since mid-October 2026, some Android app links also
  carry an app referrer, `android-app://com.openai.chatgpt/`, though not the tagged ones. The iOS app tags the links in its answers too; it opens them in an in-app
  Safari sheet, which can't pass a referrer, so the tag is the signal there.
what_works_date: 2026-10-22
seo_summary: "ChatGPT tags every web link we tested with utm_source=chatgpt.com, but most arrive with no referrer."
# link_locations are candidates until confirmed by a verified test run.
surfaces:
  - id: web-desktop
    name: Web
    platform: web
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, canvas, bare-url, pasted-link, shared-conversation]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, bare-url, pasted-link]
  - id: android
    name: Android app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, bare-url, pasted-link]
  - id: macos
    name: macOS app
    platform: native
    # canvas: as of 2026-10-20 the app answers canvas requests with "Canvas is no longer available" and
    # writes an inline "Writing" block instead. That block is tested as the canvas location.
    link_locations: [inline-citation, sources-panel, search-cards, deep-research, canvas, bare-url, pasted-link]
  - id: windows
    name: Windows app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, deep-research, canvas, bare-url, pasted-link]
work_items:
  - id: chatgpt-web-referrer
    title: Send the chatgpt.com referrer on every web link location
    tests: [REF-01, REF-03]
    surfaces: [web-desktop]
    status: open
    summary: >
      chatgpt.com already sets an `origin` referrer policy, but every outbound link also has
      `rel="noopener noreferrer"`, so no referrer arrives and sites that rely on it count the visit as Direct.
    suggested_fix: >
      Drop `noreferrer` from the outbound link component and keep `noopener`. The page's existing `origin` policy
      then sends `https://chatgpt.com/` and nothing more. Add a regression test that checks each link location.
  - id: chatgpt-safe-merge
    title: Keep sites' own UTM tags and signed URLs intact
    tests: [MRG-03, MRG-04]
    surfaces: [web-desktop, ios, android, macos, windows]
    status: open
    summary: >
      ChatGPT already merges the tag cleanly into existing queries and fragments. Two edge cases remain: a link
      that already has `utm_source=newsletter` gets it replaced with `chatgpt.com`, and signed URLs (with
      `signature` or `expires`) get the tag appended, which can break them.
    suggested_fix: >
      Skip tagging when the URL already has a `utm_*` parameter or a signature/expiry parameter, as in the
      reference implementation and test vectors.
  - id: chatgpt-android-referrer
    title: Pass an app referrer on every Android link
    tests: [REF-01]
    surfaces: [android]
    status: in-progress
    summary: >
      Since October 11–13, 2026, some Android app links arrive with `android-app://com.openai.chatgpt/` as the
      referrer, on pages across more than 100 sites. They are a different set of links from the tagged ones: almost
      none of them carry `utm_source=chatgpt.com`, and tagged Android visits, still about 35 times as many, arrive
      with no referrer.
    suggested_fix: >
      Open every link in a Custom Tab with `Intent.EXTRA_REFERRER` set to `android-app://com.openai.chatgpt`, and
      keep adding `utm_source=chatgpt.com`, so each click carries both signals.
    thank_you: Thank you to the ChatGPT Android team for passing an app referrer, the model for other Android assistants.
  - id: chatgpt-changelog
    title: Publish a changelog for link behavior
    tests: [OPS-01]
    surfaces: [web-desktop, ios, android, macos, windows]
    status: open
    summary: >
      The October 2026 change was found by analytics vendors, not announced, so sites spent a week guessing
      why ChatGPT traffic dropped.
    suggested_fix: >
      Add a dated "Link attribution" section to the publisher FAQ or release notes, and note there whenever
      the referrer or UTM behavior changes.
# Personal agent: browses for one person in its own cloud browser (see /detect-personal-agent-traffic).
agent:
  id: chatgpt-dots
  name: ChatGPT Dots
  launched: September 29, 2026
  source_url: https://techradar.com/pro/openai-launches-dots-its-always-on-ai-agents-that-are-always-watching
  summary: >
    Dots are always-on agents inside ChatGPT. Each Dot has its own cloud computer and browser and keeps working
    toward a goal between conversations.
  recognize: >
    Reported: requests carry a Web Bot Auth signature with `Signature-Agent: "https://chatgpt.com"`, verifiable
    against the key directory at `chatgpt.com/.well-known/http-message-signatures-directory`. The user agent is a
    normal Chrome one.
  signals:
    names:
      status: reported
      finding: missing
      notes: Reported to send a normal Chrome user agent.
      source_url: https://www.centinelanalytica.com/blog/ai-browser-agents
    signs:
      status: reported
      finding: works
      notes: Reported to sign requests from OpenAI's cloud browser with Web Bot Auth.
      source_url: https://www.centinelanalytica.com/blog/ai-browser-agents
    tags:
      status: untested
