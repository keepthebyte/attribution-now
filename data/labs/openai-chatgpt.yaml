id: openai-chatgpt
name: ChatGPT
company: OpenAI
documented_utm: chatgpt.com
docs_url: https://help.openai.com/en/articles/12627856
contact: null
what_works: >
  OpenAI publishes the `utm_source=chatgpt.com` value in its publisher FAQ, and ChatGPT adds it to every
  outbound link we tested on the web: citations, links in the answer text and links the user pasted. It keeps
  existing query parameters and inserts the tag before a `#fragment`. After a UI update in early October 2026,
  the tag was restored within about a week.
what_works_date: 2026-10-20
# link_locations are candidates until confirmed by a verified test run.
surfaces:
  - id: web-desktop
    name: Web (desktop)
    platform: web
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, canvas, bare-url, pasted-link, shared-conversation]
  - id: web-mobile
    name: Web (mobile)
    platform: web
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, bare-url, pasted-link, shared-conversation]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, bare-url, pasted-link]
  - id: android
    name: Android app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, bare-url, pasted-link]
  - id: macos
    name: macOS app
    platform: native
    # canvas: as of 2026-10-20 the app answers canvas requests with "Canvas is no longer available" and
    # writes an inline "Writing" block instead. That block is tested as the canvas location.
    link_locations: [inline-citation, sources-panel, search-cards, deep-research, canvas, bare-url, pasted-link]
  - id: windows
    name: Windows app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, deep-research, canvas, bare-url, pasted-link]
work_items:
  - id: chatgpt-web-referrer
    title: Send the chatgpt.com referrer on every web link location
    tests: [REF-01, REF-03]
    surfaces: [web-desktop, web-mobile]
    status: open
    summary: >
      chatgpt.com already sets an `origin` referrer policy, but every outbound link also has
      `rel="noopener noreferrer"`, so no referrer arrives and sites that rely on it count the visit as Direct.
    suggested_fix: >
      Drop `noreferrer` from the outbound link component and keep `noopener`. The page's existing `origin` policy
      then sends `https://chatgpt.com/` and nothing more. Add a regression test that checks each link location.
  - id: chatgpt-safe-merge
    title: Keep sites' own UTM tags and signed URLs intact
    tests: [MRG-03, MRG-04]
    surfaces: [web-desktop, web-mobile, ios, android, macos, windows]
    status: open
    summary: >
      ChatGPT already merges the tag cleanly into existing queries and fragments. Two edge cases remain: a link
      that already has `utm_source=newsletter` gets it replaced with `chatgpt.com`, and signed URLs (with
      `signature` or `expires`) get the tag appended, which can break them.
    suggested_fix: >
      Skip tagging when the URL already has a `utm_*` parameter or a signature/expiry parameter, as in the
      reference implementation and test vectors.
  - id: chatgpt-android-referrer
    title: Pass an app referrer from the Android app
    tests: [REF-01]
    surfaces: [android]
    status: open
    summary: >
      The Android app carries the UTM tag, but no referrer arrives, so tools that rely on the referrer see Direct.
    suggested_fix: >
      Open links in a Custom Tab and set `Intent.EXTRA_REFERRER` to `android-app://com.openai.chatgpt`, so the
      browser can pass an app referrer.
  - id: chatgpt-changelog
    title: Publish a changelog for link behavior
    tests: [OPS-01]
    surfaces: [web-desktop, web-mobile, ios, android, macos, windows]
    status: open
    summary: >
      The October 2026 change was found by analytics vendors, not announced, so sites spent a week guessing
      why ChatGPT traffic dropped.
    suggested_fix: >
      Add a dated "Link attribution" section to the publisher FAQ or release notes, and note there whenever
      the referrer or UTM behavior changes.
