id: google-gemini
name: Gemini
company: Google
documented_utm: null
observed_utm: gemini
docs_url: null
contact: null
what_works: >
  Gemini on the web sends `https://gemini.google.com/` as the referrer: the origin only, from source links and
  from links the user pasted. Its links use `rel="noopener"` without `noreferrer`, exactly as recommended. From
  September 18 to 28, 2026, Gemini links also carried `utm_source=gemini` (and `geminiforbusiness` for Workspace).
what_works_date: 2026-10-20
# link_locations are candidates until confirmed by a verified test run.
surfaces:
  - id: web
    name: Web
    platform: web
    link_locations: [inline-citation, sources-panel, search-cards, shopping-cards, map-cards, deep-research, canvas, bare-url, pasted-link, shared-conversation]
  - id: ios
    name: iOS app
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, map-cards, deep-research, bare-url, pasted-link]
  - id: android
    name: Android app (incl. assistant)
    platform: native
    link_locations: [inline-citation, sources-panel, search-cards, map-cards, deep-research, bare-url, pasted-link]
  - id: workspace
    name: Workspace
    platform: web
    observed_utm: geminiforbusiness
    link_locations: [inline-citation, sources-panel, deep-research, canvas, bare-url, pasted-link]
work_items:
  - id: gemini-document-utm
    title: Document the UTM values
    tests: [UTM-03]
    surfaces: [web, ios, android, workspace]
    status: open
    summary: >
      Gemini used `utm_source=gemini` and `utm_source=geminiforbusiness` from September 18 to 28, 2026, but the
      values are not in Google's public docs, so teams can't plan for them or tell when they change.
    suggested_fix: >
      Publish both values, and which surfaces use each, on a Gemini help page or the Search Central docs.
  - id: gemini-app-coverage
    title: Tag every outbound link with utm_source=gemini
    tests: [UTM-01, UTM-02]
    surfaces: [web, ios, android]
    status: open
    summary: >
      Gemini tagged links for 11 days in September 2026 and stopped on September 29. In that window, real Gemini
      clicks measured 2.1× what the referrer alone shows, mostly mobile visits with no referrer. Our October 20
      web test found no tag on any link.
    suggested_fix: >
      Add `utm_source=gemini` to outbound links on the web and in the iOS and Android apps with a safe merge (keep
      existing query, fragment and `utm_*` values; skip signed URLs). On Android also set an app referrer when
      opening Custom Tabs.
  - id: gemini-deep-research-referrer
    title: Keep the referrer on Deep Research sources
    tests: [REF-01, REF-03]
    surfaces: [web, workspace]
    link_locations: [deep-research]
    status: open
    summary: >
      Chat links send a referrer, but links in the "Researching websites" section of Deep Research were reported
      (May 2025) to use `noreferrer`, so those visits show as Direct.
    suggested_fix: >
      Use the same link component as chat answers: `rel="noopener"` without `noreferrer`, with a
      `strict-origin-when-cross-origin` referrer policy.
