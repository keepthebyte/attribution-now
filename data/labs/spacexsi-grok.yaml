# Personal agent: browses for one person in its own cloud browser (see /detect-personal-agent-traffic).
agent:
  id: grok-bot
  name: Grok Bot
  launched: August 2026, beta
  source_url: https://docs.x.ai/grok-bot/overview
  summary: >
    Each Bot works on a persistent cloud computer with a browser, a filesystem and a terminal.
  recognize: >
    Not documented, and in our run there was nothing to go on: the browser sent a plain Chrome on Linux user agent
    with normal client hints, from Cloudflare's network. It ran the page's JavaScript, so analytics tags count it as
    a desktop visitor. It read a JSON link through Exa's fetcher instead of its browser; those requests name and
    sign themselves as `ExaUser`. When a site blocks cloud computers, the person can route the Bot's traffic through
    their own computer, and those visits look like the person.
  signals:
    names:
      status: missing
      date: 2026-10-31
      method: manual
      notes: "User agent: `Mozilla/5.0 (X11; Linux x86_64) … Chrome/156.0.0.0 Safari/537.36` with Google Chrome `Sec-CH-UA` brands, from Cloudflare (AS13335). No agent token. One run."
    signs:
      status: missing
      date: 2026-10-31
      method: manual
      notes: No `Signature-Agent` or `Signature` header on the browser's requests. The agent card it read came through Exa (`ExaUser/1.0`), signed with Web Bot Auth as `https://exauser.crawler.exa.ai`.
    tags:
      status: untested
