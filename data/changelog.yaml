# Dated lab changes, newest first on the site (order here doesn't matter).
# type: shipped | change | site
# Every shipped improvement gets a thank_you line.
entries:
  - date: 2026-10-16
    lab: openai-chatgpt
    type: shipped
    title: ChatGPT restored the utm_source tag on cited links
    text: >
      By October 16, about 99% of ChatGPT answers with cited links had at least one tagged link again,
      about a week after the tag dropped. Reports say the referrer is still missing on many web clicks.
    source_url: https://www.tryprofound.com/blog/chatgpt-missing-utm-tags
    verified: false
    thank_you: Thank you to the OpenAI team for the quick fix, and to Profound for the open data.
  - date: 2026-10-08
    lab: openai-chatgpt
    type: change
    title: ChatGPT links lost the UTM tag and referrer after a UI update
    text: >
      Starting October 8, a growing share of ChatGPT links arrived without `utm_source=chatgpt.com` and without
      a referrer. Many sites saw ChatGPT traffic fall and Direct traffic rise. We share it as a common lesson:
      link handling is easy to change by accident in a fast UI cycle, and a regression test per link location
      catches it.
    source_url: https://www.searchenginejournal.com/chatgpt-traffic-drop-appears-to-be-a-tracking-problem/593157/
    verified: false
  - date: 2026-09-29
    lab: google-gemini
    type: change
    title: Gemini stopped tagging links with utm_source=gemini
    text: >
      On September 29 the `utm_source=gemini` tag stopped appearing on Gemini links, after 11 days. Visits that
      arrive without a referrer, mostly on mobile, are counted as Direct again. Our October 20 web test found no
      tag on any Gemini link.
    source_url: null
    verified: true
  - date: 2026-09-18
    lab: google-gemini
    type: shipped
    title: Gemini tagged its links with utm_source=gemini for 11 days
    text: >
      From September 18 to 28, Gemini links carried `utm_source=gemini` (`geminiforbusiness` for Workspace;
      earlier partial sightings from September 10). It gave sites a rare measurement: across 1,000+ domains in
      AEM Operational Telemetry (real-user visits, bots excluded), real Gemini clicks were 2.1× what the
      referrer alone shows, about 2.5× once untagged links are accounted for. Most of the gap was mobile visits
      with no referrer, normally counted as Direct.
    source_url: null
    verified: true
    thank_you: Thank you to the Gemini team. Eleven days of tagging showed the size of the gap more clearly than any estimate.
