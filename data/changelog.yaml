# Dated lab changes, newest first on the site (order here doesn't matter).
# type: shipped | change | site
# Every shipped improvement gets a thank_you line.
entries:
  - date: 2026-10-15
    lab: openai-chatgpt
    type: shipped
    title: ChatGPT restored the utm_source=chatgpt.com tag
    text: >
      On October 14, OpenAI confirmed the missing tag was a known bug and that a fix was coming that week. The fix
      started rolling out around 2am PT on October 15, in stages, and by 9am PT tagged ChatGPT clicks were back to
      about 95–100% of the same hour a week earlier, across thousands of domains in AEM Operational Telemetry.
      The referrer is still missing on most ChatGPT clicks, so the tag is the signal sites can rely on.
    source_url: https://www.linkedin.com/posts/cedrichuesler_relieved-it-was-a-bug-chatgpt-is-tagging-share-7516558430854152192-vTAO/
    verified: true
    thank_you: Thank you to the OpenAI team for confirming within hours and shipping the fix within a day.
  - date: 2026-10-08
    lab: openai-chatgpt
    type: change
    title: ChatGPT links lost the UTM tag after the GPT-6 rollout
    text: >
      Around 2pm PT on October 8, ChatGPT stopped adding `utm_source=chatgpt.com` to its links. With no tag and no
      referrer, ChatGPT visits that sites could attribute fell to about a third of normal within hours and showed up
      as Direct instead. The visits were never lost, only hidden. The drop was reported publicly on October 13
      by Cedric Huesler. We share it as a common lesson: link handling is easy to change by accident in a fast
      UI cycle, and a regression test per link location catches it. If you report on this period, annotate
      October 8–15 as one event, not a trend.
    source_url: https://www.linkedin.com/posts/cedrichuesler_relieved-it-was-a-bug-chatgpt-is-tagging-share-7516558430854152192-vTAO/
    verified: true
  - date: 2026-09-29
    lab: google-gemini
    type: change
    title: Gemini stopped tagging links with utm_source=gemini
    text: >
      On September 29 the `utm_source=gemini` tag stopped appearing on Gemini links, after 11 days. Visits that
      arrive without a referrer, mostly on mobile, are counted as Direct again. Our October 20 web test found no
      tag on any Gemini link.
    source_url: https://www.linkedin.com/posts/cedrichuesler_for-11-days-in-september-gemini-tagged-its-share-7516660753714663425-52Pm/
    verified: true
  - date: 2026-09-18
    lab: google-gemini
    type: shipped
    title: Gemini tagged its links with utm_source=gemini for 11 days
    text: >
      From September 18 to 28, Gemini links carried `utm_source=gemini` (`geminiforbusiness` for Workspace;
      earlier partial sightings from September 10). It gave sites a rare measurement: across 1,000+ domains in
      AEM Operational Telemetry (real-user visits, bots excluded), real Gemini clicks were 2.1× what the
      referrer alone shows, about 2.5× once untagged links are accounted for. Most of the gap was mobile visits
      with no referrer, normally counted as Direct.
    source_url: https://www.linkedin.com/posts/cedrichuesler_for-11-days-in-september-gemini-tagged-its-share-7516660753714663425-52Pm/
    verified: true
    thank_you: Thank you to the Gemini team. Eleven days of tagging showed the size of the gap more clearly than any estimate.
