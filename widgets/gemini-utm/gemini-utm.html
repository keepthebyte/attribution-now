<figure class="gemini-utm-figure">
  <ul class="gemini-utm-legend">
    <li class="gemini-utm-key-visible">Visible: gemini.google.com referrer</li>
    <li class="gemini-utm-key-hidden">Hidden: no referrer, only the utm_source=gemini tag</li>
  </ul>
  <div class="gemini-utm-chart">
    <canvas role="img" aria-label="Daily Gemini visits, Sep 11 to Oct 11, 2026. Visits with a Gemini referrer stay level the whole time. From Sep 18 to 28, about as many tagged visits with no referrer appear on top of them. On Sep 29 the tag stops and they disappear."></canvas>
  </div>
  <figcaption>
    Daily visits, indexed: 100 is the average day of referred Gemini visits, Sep 11–17, 2026.
    Source: AEM Operational Telemetry, real-user visits on 1,000+ domains, bots excluded.
  </figcaption>
  <details class="gemini-utm-data">
    <summary>Daily numbers</summary>
    <div class="gemini-utm-table"></div>
  </details>
</figure>
