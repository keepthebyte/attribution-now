name = "attribution-now"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
account_id = "6372a8dc9272173423d297a590dd98fa"

routes = [
  { pattern = "attribution.now/*", zone_name = "attribution.now" },
  { pattern = "www.attribution.now/*", zone_name = "attribution.now" },
]

[vars]
ORIGIN_HOSTNAME = "main--attribution-now--keepthebyte.aem.live"
CANONICAL_HOST = "attribution.now"
# poppy.json from Adobe's Personal Agent Gateway (intent logging); remove to serve our own
POPPY_GATEWAY = "https://m.adobe.io"
# the gateway's service id for this site: eds-<owner>--<repo> on Edge Delivery
# (an AEM Cloud Service site sends its program/environment instead, e.g. cm-p91957-e887971)
POPPY_AEM_SERVICE = "eds-keepthebyte--attribution-now"
# PUSH_INVALIDATION = "disabled"
# ORIGIN_AUTHENTICATION is a secret: wrangler secret put ORIGIN_AUTHENTICATION

[[d1_databases]]
binding = "HITS"
database_name = "attribution-now-hits"
database_id = "bd4be178-7e55-4a00-ad25-e9983ff363c2"
migrations_dir = "migrations"
